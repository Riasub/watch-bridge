name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 우분투 러너에는 Android SDK 가 이미 있다(ANDROID_HOME). 필요한 패키지만 확인한다.
      - name: Android SDK 패키지 확인
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: 단위 테스트
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain
      - name: 디버그 APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: watch-bridge-galaxy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
