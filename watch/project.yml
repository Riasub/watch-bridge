name: WatchBridge
options:
  bundleIdPrefix: dev.watchbridge
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WatchBridge:
    type: application
    platform: watchOS
    sources:
      - path: WatchBridge
    settings:
      base:
        # 개발자 계정을 만든 뒤 본인 팀 ID와 고유한 번들 ID 로 바꾼다.
        PRODUCT_BUNDLE_IDENTIFIER: dev.watchbridge.watch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: WatchBridge/Info.plist
      properties:
        CFBundleDisplayName: 워치 브리지
        WKApplication: true
        NSBluetoothAlwaysUsageDescription: 갤럭시 폰에서 카카오톡 알림을 받기 위해 블루투스를 사용합니다.
        NSHealthShareUsageDescription: 앱을 백그라운드에서 계속 실행하기 위한 운동 세션에 사용합니다. 건강 데이터를 읽거나 저장하지 않습니다.
        NSHealthUpdateUsageDescription: 앱을 백그라운드에서 계속 실행하기 위한 운동 세션에 사용합니다. 건강 데이터를 읽거나 저장하지 않습니다.
        WKBackgroundModes:
          - workout-processing
          - physical-therapy
    entitlements:
      path: WatchBridge/WatchBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
schemes:
  WatchBridge:
    build:
      targets:
        WatchBridge: all
    run:
      config: Debug
